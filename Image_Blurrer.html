<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Blurrer</title>
    <link rel="stylesheet" href="Image_Blurrer.css">
</head>
<body>

    <main class="carousel" aria-label="Image carousel">

        <!-- White text box -->
        <div class="overlay">
            <h1>Image Blurrer</h1>
            <p>Upload an image to apply a blur effect.</p>
            <br>
            <input type="file" id="imageUpload" accept="image/*">
            <canvas id="imageCanvas" width="500" height="35"></canvas>
            <label for="blurAmount">Blur Amount:</label>
            <br>
            <input type="range" id="blurAmount" min="0" max="20" value="5">
            <span id="blurValue">5</span>
        </div>

        <!-- Image carousel -->
        <div class="carousel-track">

            <div
                class="carousel-slide"
                style="background-image: url('images/images (1).jpg');"
                aria-label="Item 1">
            </div>

            <div
                class="carousel-slide"
                style="background-image: url('images/business-meeting_Z1ZIMB54UM.jpg');"
                aria-label="Item 2">
            </div>

            <div
                class="carousel-slide"
                style="background-image: url('images/city-port_K5CXXZEVUX.webp');"
                aria-label="Item 3">
            </div>

            <div
                class="carousel-slide"
                style="background-image: url('images/people-back_Q71CIRI83F.jpg');"
                aria-label="Item 4">
            </div>

            <div
                class="carousel-slide"
                style="background-image: url('images/people-tourists_0XAACTIEKS.jpg');"
                aria-label="Item 5">
            </div>

            <div
                class="carousel-slide"
                style="background-image: url('images/sea-natural_EMYSEYJNCE.jpg');"
                aria-label="Item 6">
            </div>

        </div>
    </main>

</body>
</html>
